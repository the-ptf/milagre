[package]
name = "milagre-accounts"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure account selection and environment planning for the isolated Rust owner"

[workspace]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tempfile = "3"
regex = "1"
ryu-js = "1.0.3"

serde = { version = "1", features = ["derive"] }
blake3 = "1"
