[package]
name = "milagre-gpui-spike"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "GPUI spike: Milagre's desktop shell (sidebar, Chat, side panel) drawn with Zed's UI framework"

[workspace]

[[bin]]
name = "milagre-gpui-spike"
path = "src/main.rs"

[features]
# Code blocks in the transcript are highlighted (src/ui/markdown/highlight.rs maps the colours).
default = ["syntect"]
# WP-01's fit-check gallery (src/fitcheck/gallery.rs) for snapshots: MILAGRE_GPUI_FITCHECK=<page>.
# Probe code only; the app never turns it on. The fit-check tests themselves build under `cargo test`.
fitcheck = []
# The D1 webview probe: gpui-webview (wry on WKWebView) behind a feature, off by default.
webview = ["fitcheck", "dep:gpui-webview", "dep:wry"]
# gpui-component's syntect highlighter (and two-face's grammars): code colours in markdown, on by default.
syntect = ["gpui-component/syntect"]

[dependencies]
# GPUI from `gpui-pre`: weekly crates.io snapshots of zed-industries/zed's own `gpui` crates (0.3.12 is
# zed@d2a4fb6, 2026-11-08). Exact pins; see README.md "GPUI version decision". Imported under the
# names upstream uses (`gpui`, `gpui_platform`), so moving to a zed git rev changes only this file.
gpui = { package = "gpui-pre", version = "=0.3.12" }
# The platform (AppKit window, Metal renderer, CoreText) lives in its own crates upstream.
# `font-kit` is the macOS text system (CoreText); without it gpui_macos falls back to a no-op text
# system and draws no text at all. `runtime_shaders` compiles the Metal shaders when the app starts
# instead of at build time, so the build does not need Xcode's separately downloaded Metal Toolchain
# (absent on this Mac).
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "runtime_shaders"] }
# Longbridge's component library (Apache-2.0), built on the same gpui-pre snapshot: text input and
# editor, selectable text and markdown, dock, resizable panels, scrollbars, menus, dialogs, tooltips.
# Available to views; the spike's own sidebar, transcript and composer do not use it yet (README.md).
gpui-component = "=0.9.1"
# Lucide icons gpui-component's widgets load by path; our AssetSource falls back to it.
gpui-kit-assets = "=0.9.1"
# gpui-component's behaviour layer (already in its tree, so no new crate): the rich text view, its
# window-wide selection and markdown extensions are defined here and only partly re-exported by
# gpui-component. Used by the fit check (src/fitcheck/) and the theme bridge.
gpui-base = "=0.9.1"
# The D1 probe (feature `webview`): a wry child webview in a GPUI window. Same release train as
# gpui-component; `lb-wry` is Longbridge's wry fork that gpui-webview builds on.
gpui-webview = { version = "=0.9.1", optional = true }
wry = { package = "lb-wry", version = "=0.53.3", optional = true }
# Errors in the asset source and the data layer. Already in GPUI's tree (its `Result` is anyhow's).
anyhow = "1"
# A message context kind src/data does not type (`ChatContext::Other`) keeps its whole JSON object. Already in
# GPUI's tree (Cargo.lock), so it adds no new crate.
serde_json = "1"
# Transcript markdown (src/workspace/chat/markdown.rs): CommonMark events, turned into GPUI blocks by hand.
pulldown-cmark = { version = "0.13", default-features = false }
# Composer caret movement and backspace by grapheme cluster, as GPUI's own `input` example does.
# Already in GPUI's dependency tree (Cargo.lock), so it adds no new crate.
unicode-segmentation = "1.10"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in GPUI's tree at this version; used by src/snapshot.rs to find the window's NSView.
raw-window-handle = "0.6"

[dev-dependencies]
# `test-support` adds GPUI's headless test platform (`#[gpui::test]`, `TestAppContext`, `debug_selector`).
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
