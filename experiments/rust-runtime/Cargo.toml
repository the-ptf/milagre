[package]
name = "milagre-rust-runtime"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "milagre-rust-runtime"
description = "Isolated read integration of Milagre's Rust wire server and saved Project reader"

[dependencies]
libc = "0.2"
milagre-owner-store = { path = "../rust-owner" }
milagre-owner-wire = { path = "../rust-owner-wire" }
milagre-content-store = { path = "../rust-content-store" }
milagre-ports = { path = "../rust-ports" }
milagre-terminals = { path = "../rust-terminals" }
milagre-git-read = { path = "../rust-git" }
milagre-tools = { path = "../rust-tools" }
milagre-claude = { path = "../rust-claude" }
milagre-providers = { path = "../rust-providers" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"

[workspace]

[[bin]]
name = "runtime-fake-claude"
path = "../rust-claude/src/bin/fake_claude.rs"
test = false
doc = false
