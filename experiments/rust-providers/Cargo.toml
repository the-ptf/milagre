[package]
name = "milagre-providers"
version = "0.1.0"
edition = "2021"
publish = false
description = "Provider process adapters for Milagre's Rust backend (Codex app-server first)."
license = "MIT"

# Standalone: not a member of any other Rust workspace in the repo (experiments/rust-owner has its own).
[workspace]

[lib]
name = "milagre_providers"
path = "src/lib.rs"

# Deterministic stand-in for `codex app-server`, used by the integration tests only.
[[bin]]
name = "fake-codex-app-server"
path = "src/bin/fake_codex_app_server.rs"
test = false
doc = false

[dependencies]
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
thiserror = "2"
tokio = { version = "1.47", features = ["process", "io-util", "sync", "time", "rt", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.47", features = ["process", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros", "test-util"] }
