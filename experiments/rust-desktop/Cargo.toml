[package]
name = "milagre-rust"
version = "0.1.0"
edition = "2021"
default-run = "milagre-rust"
[features]
default = []
app-fixture = ["dep:tempfile"]
fixture-native-smoke = ["app-fixture"]
fixture-send-smoke = ["fixture-native-smoke"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
tempfile = { version = "3", optional = true }

base64 = "0.22"
regex = "1"
rfd = "0.15"
tauri-plugin-notification = "2.8.1"

tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep", "NSPasteboard", "NSRunningApplication", "NSEvent", "NSWindow", "block2"] }
objc2-foundation = "0.3"

[[bin]]
name = "milagre-rust-fixture"
path = "src/bin/fixture.rs"
required-features = ["app-fixture"]
