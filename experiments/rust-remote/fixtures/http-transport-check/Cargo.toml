[package]
name = "milagre-offline-http-transport-check"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline Hyper allocation and joined-ownership probe; no sockets or authority"

[dependencies]
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
http = "=1.5.0"
http-body = "=1.1.0"
bytes = "=1.12.1"
httparse = "=1.10.1"
# Pin the audited transitive graph too. No Tokio runtime/net/time features.
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }
futures-core = "=0.3.34"
atomic-waker = "=1.1.2"
itoa = "=1.0.19"
pin-project-lite = "=0.2.17"
smallvec = { version = "=1.16.5", features = ["const_generics", "const_new"] }
want = "=0.3.2"
try-lock = "=0.2.5"

[workspace]
