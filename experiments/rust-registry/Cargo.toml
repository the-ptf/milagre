[package]
name = "milagre-registry"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
milagre-owner-store = { path = "../rust-owner" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
libc = "0.2"
[dev-dependencies]
tempfile = "3"
[workspace]
