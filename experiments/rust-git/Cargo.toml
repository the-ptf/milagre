[package]
name = "milagre-git-read"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded, admitted-root Git reads for Milagre's Rust owner migration."

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
futures-util = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
