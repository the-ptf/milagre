[package]
name = "milagre-acp"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Isolated bounded ACP process/protocol checkpoint for Milagre"

[features]
default = []
fake-session = ["dep:sha2"]
launch-planning = []
macos-private-copy-fixture = ["dep:sha2", "dep:tempfile"]

[workspace]

[[bin]]
name = "fake-acp-agent"
path = "src/bin/fake_acp_agent.rs"
test = false
doc = false

[[bin]]
name = "native-acp-copy-fixture"
path = "src/bin/native_acp_copy_fixture.rs"
required-features = ["macos-private-copy-fixture"]
test = false
doc = false

[dependencies]
tempfile = { version = "3", optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2"
tokio = { version = "1.47", features = ["process", "io-util", "sync", "time", "rt", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.47", features = ["rt-multi-thread"] }
