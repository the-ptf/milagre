[package]
name = "milagre-owner-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read-only Rust repositories for Milagre's Project JSON and chats.db formats (owner migration foundation)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "milagre-owner-store"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[workspace]
