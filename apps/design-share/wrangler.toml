name = "milagre-design-share"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "share.milagre.cloud", custom_domain = true }]

[vars]
PUBLIC_ORIGIN = "https://share.milagre.cloud"
MAX_TOTAL_BYTES = "21474836480"

# Artifact pages' files. Create it once with `npx wrangler@4.147.0 r2 bucket create milagre-design-share-files`.
[[r2_buckets]]
binding = "FILES"
bucket_name = "milagre-design-share-files"

[[durable_objects.bindings]]
name = "PAGES"
class_name = "DesignPage"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "PublishQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DesignPage", "PublishQuota"]

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true
