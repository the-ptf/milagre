name: Reviewers
on:
  # pull_request_target runs the base branch's script, so it never executes PR code.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  round-robin:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/assign-reviewers.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Request Victor plus the next reviewer in the rotation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/assign-reviewers.cjs
