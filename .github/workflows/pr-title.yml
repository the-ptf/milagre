name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # `conventional` is a required check, so the merge queue waits for it too. The title was already checked to enter
  # the queue and a merge group carries no PR title, so there every step is skipped and the job reports green.
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: read
jobs:
  conventional:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Require a Conventional Commit title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e '
            const title = process.env.TITLE
            const ok = /^(feat|fix|perf|docs|refactor|chore|ci|test|style|build|revert)(\([a-z0-9-]+\))?!?: \S/.test(title)
            if (!ok) { console.error("PR title must look like `fix: short summary` (feat, fix, perf, docs, refactor, chore, ci, test, style, build, revert). Got: " + title); process.exit(1) }
          '
      # Main squash-merges with the PR's commit messages as the body, so an AI co-author trailer in any commit lands on
      # main for good. This job is the required check, so the trailer stops the PR here.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/check-attribution.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: No AI attribution in the commits or the description
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-attribution.cjs --github-pr
