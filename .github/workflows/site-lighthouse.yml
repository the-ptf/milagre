# Holds a PR that touches the site to its Lighthouse budget (apps/site/lighthouse-budget.json). The CI Electron shards
# run the same check, but only when desktop code changed; a site-only PR skipped it until merge. Ubuntu runners ship
# Google Chrome, which chrome-launcher finds; the check builds the site and serves it itself.
name: Site Lighthouse
on:
  pull_request:
    # DESIGN.md builds the /design page the check scores.
    paths: ["apps/site/**", "DESIGN.md", "scripts/test-site-lighthouse.cjs", ".github/workflows/site-lighthouse.yml"]
permissions:
  contents: read
concurrency:
  group: site-lighthouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Hold the site to its Lighthouse budget
        run: npm test -- --only lighthouse
