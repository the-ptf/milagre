name: Build signed Windows candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (X.Y.Z); builds the selected branch without publishing a release
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Validate candidate version and signing configuration
        shell: pwsh
        run: |-
          node -e 'if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.VERSION)) throw new Error("Expected X.Y.Z"); require("./scripts/windows-azure-signing.cjs")();'
          if ($LASTEXITCODE -ne 0) { throw 'Invalid candidate configuration' }
      - name: Authenticate signing identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install dependencies
        run: npm ci
      - name: Build signed Windows installer
        shell: bash
        run: npm run package:win -- --config scripts/windows-azure-signing.cjs --config.extraMetadata.version="${VERSION}"
      - name: Verify installer and app Authenticode
        shell: pwsh
        run: |-
          $files = @((Get-ChildItem release/Milagre-Setup-*-x64.exe), (Get-Item release/win-unpacked/Milagre.exe))
          if ($files.Count -ne 2) { throw 'Expected one installer and its app executable' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on $($file.Name): $($signature.Status)" }
            $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($publisher -cne $env:AZURE_SIGNING_PUBLISHER) { throw 'Signed publisher differs from updater configuration' }
          }
      - name: Install and exercise signed candidate
        shell: pwsh
        run: |-
          $installer = (Get-ChildItem release/Milagre-Setup-*-x64.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'Milagre Signed Candidate'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', '/currentuser', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          node scripts/test-desktop.cjs --packaged (Join-Path $destination 'Milagre.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Signed candidate check failed' }
      - name: Upload signed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-windows-${{ inputs.version }}
          path: |-
            release/Milagre-Setup-*-x64.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
